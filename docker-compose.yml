services:
  db:
    image: postgres:16-alpine
    container_name: saludya_db
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - saludya_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: saludya_api
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:${POSTGRES_PORT}/${POSTGRES_DB}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app
      # Pruebas: docker compose exec api pytest
      - ./backend/tests:/app/tests

  # Calidad del código (opcional, no arranca con "docker compose up"):
  #   docker compose --profile calidad up -d sonarqube
  # Ver README, sección "Calidad del código (SonarQube)".
  sonarqube:
    image: sonarqube:community
    container_name: saludya_sonarqube
    profiles: ["calidad"]
    environment:
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    ports:
      - "127.0.0.1:9000:9000" # solo en este equipo
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions

volumes:
  saludya_pgdata:
  sonarqube_data:
    name: saludya_sonar_data
  sonarqube_extensions:
    name: saludya_sonar_extensions
