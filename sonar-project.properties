# Análisis de calidad con SonarQube. Se corre con: scripts/analisis-sonar.sh
sonar.projectKey=saludya
sonar.projectName=SaludYA
sonar.sourceEncoding=UTF-8

# Código de la aplicación y sus pruebas.
sonar.sources=backend/app,frontend/src
sonar.tests=backend/tests,frontend/tests
sonar.exclusions=**/__pycache__/**,frontend/src/main.jsx

# Cobertura de las pruebas (la generan pytest y Vitest; ver el script).
sonar.python.version=3.12
sonar.python.coverage.reportPaths=backend/coverage.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
